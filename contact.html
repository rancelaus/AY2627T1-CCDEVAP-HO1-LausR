<!doctype html>
<html>
  <head>
    <title>send me an email!!</title>
  </head>

  <body>
    <header>
      <h1>get in touch! (or not)</h1>
    </header>

    <main>
      <section id="contact">
        <p>you can send me an email at:</p>

        <a href="mailto:rance_laus@dlsu.edu.ph">rance_laus@dlsu.edu.ph</a>
      </section>

      <hr />

      <section id="contact-form">
        <h2>or just fill out this form!</h2>

        <form
          action="mailto:rance_laus@dlsu.edu.ph"
          method="post"
          enctype="text/plain"
        >
          <label for="name">who are u?</label>
          <input type="text" id="name" name="name" required />

          <br />

          <label for="email">wat ur email?</label>
          <input type="email" id="email" name="email" required />

          <br />

          <label for="message">wat do u want to say?</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <br />

          <input type="submit" value="send" />
        </form>
      </section>

      <hr />

      <img src="media/dancing_cat.gif" alt="cute dancing cat" width="150" />

      <nav>
        <ul>
          <li><a href="index.html">back to mi homepage!</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
